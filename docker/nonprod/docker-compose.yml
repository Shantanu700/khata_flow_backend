# Development stack. Run from the repo root:
#   docker compose -f docker/nonprod/docker-compose.yml up -d
# The API is then on https://localhost:8000 (API_PORT to change it), using the mkcert certificate in
# docker/nonprod/certs/ (see README: Run it yourself).
name: khaataflow

# No env_file: Django reads the mounted .env itself, so editing it never needs a container restart.
x-app: &app
  build:
    context: ../..
    dockerfile: docker/nonprod/Dockerfile
  image: khaataflow:dev
  volumes:
    - ../..:/app
    - media:/app/media

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: khaataflow
      POSTGRES_USER: khaataflow
      POSTGRES_PASSWORD: khaataflow
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory of this path.
      - pgdata:/var/lib/postgresql
    ports:
      - "${DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khaataflow -d khaataflow"]
      interval: 2s
      retries: 30

  # Migrations are generated, not committed (same convention as the owner's other repos).
  init:
    <<: *app
    command: sh -c "python manage.py makemigrations shops ledger voice && python manage.py migrate && python manage.py group_old_commands"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: >
      python manage.py runsslserver 0.0.0.0:8000
      --certificate /app/docker/nonprod/certs/localhost.pem --key /app/docker/nonprod/certs/localhost-key.pem
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  # The live-transcript WebSocket (modules/voice/stream.py) on https://localhost:8001; the API stays on runsslserver.
  # Warnings only: uvicorn's connection lines would print the short-lived ticket, which travels in the URL.
  stream:
    <<: *app
    command: >
      uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --lifespan off --no-access-log --log-level warning
      --ssl-certfile /app/docker/nonprod/certs/localhost.pem --ssl-keyfile /app/docker/nonprod/certs/localhost-key.pem
      --reload --reload-dir /app/config --reload-dir /app/base --reload-dir /app/modules
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${STREAM_PORT:-8001}:8001"
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  pgdata:
  media:
