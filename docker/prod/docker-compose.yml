# Production on one server. From the repo root:
#   docker compose -f docker/prod/docker-compose.yml up -d --build
# Settings come from docker/prod/.env (copy docker/prod/.env.example). See docker/prod/README.md.
name: khaataflow-prod

services:
  api:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    env_file: .env
    # Migrations are generated, not committed: the volumes below keep the generated files between deploys,
    # so each deploy migrates from the last one instead of starting from a fresh 0001.
    # --forwarded-allow-ips: only Caddy can reach this port, so its X-Forwarded-Proto is trusted (Django sees https).
    # No access log: the live-transcript ticket travels in the WebSocket URL.
    command: >
      sh -c "python manage.py makemigrations shops ledger voice && python manage.py migrate --noinput &&
      exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --lifespan off --no-access-log
      --proxy-headers --forwarded-allow-ips '*'"
    volumes:
      - shops-migrations:/app/modules/shops/migrations
      - ledger-migrations:/app/modules/ledger/migrations
      - voice-migrations:/app/modules/voice/migrations
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    # Only the hostname: the rest of .env is secrets Caddy has no use for.
    environment:
      API_HOST: ${API_HOST:?set API_HOST in docker/prod/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  shops-migrations:
  ledger-migrations:
  voice-migrations:
  caddy-data:
  caddy-config:
